<!DOCTYPE html>
<html lang="en">
<head>
  <title>AVA principal</title>
  <link rel="stylesheet" type="text/css" href="estilos.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header class="fsection">
    <nav class="overlay">
      <img id="logo" src="logo2.jpg" alt="logo">
      <section>
        <h1>AVA</h1>
        <h4 id="downt">Airline</h4>
      </section>
    </nav>
      <p id="slogan">Fly with us, <br> your best option</p>
      <img id="nav" src="plane.jpg" alt="avion" class="background-img">
  </header>
    <main>
      <section class="container">
      <input type="radio" name="options" id="tab1" checked> 
        <label for="tab1">
          <div class="content">Booking a flight</div>
        </label>
      <input type="radio" name="options" id="tab2">
        <label for="tab2">
          <div class="content">Check-in</div> 
        </label>

      <article class="tab-content">
        <div class="booking-data">
            <label class="radio-container">
              <input type="radio" name="vuelo" value="Return" checked> 
              <span class="checkmark"></span>
              Return
            </label>
            <label class="radio-container">
              <input type="radio" name="vuelo" value="One way"> 
              <span class="checkmark"></span>
              One way
            </label>
             <div class="form-group">
                <label for="from">Origin:</label>
                <input type="text" id="from" name="origin" placeholder="City or Airport" required>
            </div>
            <div class="form-group">
                <label for="to">Destination:</label>
                <input type="text" id="to" name="destination" placeholder="City or Airport" required>
            </div>
        </div>
        <div class="check-in-data">
            <h2>Check-in</h2>
            <p>Check in for your flight here...</p>
        </div>
      </article>
      </section>
    </main>
</body>
</html>
