<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <title>Selección de Asientos - Horizontal</title>
    <link rel="stylesheet" href="cabina.css">
</head>
<body>

    <header class="header-avion">
        <img src="plane.jpg" alt="Logo Aerolínea" class="logo-avion">
    </header>

    <div class="contenedor-principal">
        <div class="panel-pasajeros">
    <h3>Pasajeros</h3>
    <div id="lista-seleccion-pasajeros">
        </div>
</div>

        <!-- Leyenda -->
        <div class="leyenda">
            <h3>Leyenda</h3>
            <div class="leyenda-item">
                <div class="leyenda-icono vip"></div>
                <div class="leyenda-texto">
                    <strong>VIP</strong>
                    <span>Clase preferente</span>
                </div>
            </div>
            <div class="leyenda-item">
                <div class="leyenda-icono standard"></div>
                <div class="leyenda-texto">
                    <strong>Estándar</strong>
                    <span>Clase económica</span>
                </div>
            </div>
            <div class="leyenda-item">
                <div class="leyenda-icono selected"></div>
                <div class="leyenda-texto">
                    <strong>Seleccionado</strong>
                    <span>Tu asiento elegido</span>
                </div>
            </div>
        </div>

        <!-- Cabina -->
        <div class="fuselaje-blanco">
            
            <div class="mapa-layout">
                <aside class="asiento-cabezales">
                    <div>A</div>
                    <div>B</div>
                    <div>C</div>
                    <div class="espacio"></div> 
                    <div>D</div>
                    <div>E</div>
                    <div>F</div>
                </aside>
                <section class="seccion-asientos">
                    <div id="vip" class="cabinavp"></div>
                    <div id="standard-container" class="cabina"></div>
                </section>
            </div>

            <div class="exit-label"><h3>EXIT</h3></div>

            
        </div>
        <div class="contenedor-guardado">
            <button id="btn-guardar-ids" class="btn-finalizar">Confirmar Todos los Asientos</button>
        </div>
    </div>

    <script src="cabina.js"></script>
</body>
</html>
