<!DOCTYPE html>
<html lang="en">
<head>
    <title>AVA principal</title>
    <link rel="stylesheet" type="text/css" href="estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="fsection">
        <nav class="overlay">
            <img id="logo" src="logo2.jpg" alt="logo">
            <section>
                <h1>AVA</h1>
                <h4 id="downt">Airline</h4>
            </section>
            <a href="https://github.com/daniArtificer/AVA-booking.git" class="btn-contact">Contact us</a>
        </nav>
        <p id="slogan">Fly with us, <br> your best option</p>
        <img id="nav" src="plane.jpg" alt="avion" class="background-img">
    </header>

    <main>
        <section class="container">
            <input type="radio" name="options" id="tab1" checked> 
            <label for="tab1">
                <div class="content">Booking a flight</div>
            </label>

            <input type="radio" name="options" id="tab2">
            <label for="tab2">
                <div class="content">Check-in</div> 
            </label>

            <article class="tab-content">
                <div class="booking-data">
                    
                    <div id="trip-type">
                        <label class="radio-container">
                            <input id="return" type="radio" name="vuelo" value="Return" checked> 
                            <span class="checkmark"></span> Return
                        </label>
                        <label class="radio-container">
                            <input id="destination" type="radio" name="vuelo" value="One way"> 
                            <span class="checkmark"></span> One way
                        </label>
                    </div>

                    <div class="row-inputs">
                        <div class="form-group origin-container">
                            <input type="text" id="from" name="origin" placeholder="From" list="countries-list" required>
                        </div>

                        <div class="dates-wrapper">
                            <div class="date-box">
                                <label>Departure</label>
                                <input type="date" id="departure-date">
                            </div>
                            <div class="date-box">
                                <label>Return</label>
                                <input type="date" id="return-date">
                            </div>
                            </div>
                        </div>

                    <datalist id="countries-list">
                        <option value="Spain"></option>
                        <option value="United States"></option>
                        <option value="United Kingdom"></option>
                        <option value="France"></option>
                        <option value="China"></option>
                        <option value="Germany"></option>
                        <option value="Italy"></option>
                        <option value="Mexico"></option>
                        <option value="Argentina"></option>
                        <option value="Japan"></option>
                    </datalist>

                    <div class="form-group">
                        <input type="text" id="to" name="destiny" placeholder="To" list="countries-list" required>
                    </div>

                    <div class="booking-row">
                        <div class="passenger-selector">
                            <input type="checkbox" id="check-passengers" class="toggle-input">
                            <label for="check-passengers" id="passengers-text" class="passengers-trigger">
                                Select Passengers <span class="arrow">▼</span>
                            </label>

                            <div class="dropdown-box">
                                <div class="passenger-row">
                                    <div class="label-group">
                                        <span class="main-label">Adults</span>
                                        <span class="sub-label">12+ years</span>
                                    </div>
                                    <div class="controls">
                                        <button type="button" onclick="cambiarCantidad('adults', -1)">-</button>
                                        <span id="num-adults">0</span>
                                        <button type="button" onclick="cambiarCantidad('adults', 1)">+</button>
                                    </div>
                                </div>

                                <div class="passenger-row">
                                    <div class="label-group">
                                        <span class="main-label">Children</span>
                                        <span class="sub-label">2-11 years</span>
                                    </div>
                                    <div class="controls">
                                        <button type="button" onclick="cambiarCantidad('children', -1)">-</button>
                                        <span id="num-children">0</span>
                                        <button type="button" onclick="cambiarCantidad('children', 1)">+</button>
                                    </div>
                                </div>

                                <div class="passenger-row">
                                    <div class="label-group">
                                        <span class="main-label">Seniors</span>
                                        <span class="sub-label">65+ years</span>
                                    </div>
                                    <div class="controls">
                                        <button type="button" onclick="cambiarCantidad('seniors', -1)">-</button>
                                        <span id="num-seniors">0</span>
                                        <button type="button" onclick="cambiarCantidad('seniors', 1)">+</button>
                                    </div>
                                </div>
                                
                                <label for="check-passengers" class="btn-confirm" style="display:block; text-align:center; cursor:pointer;">
                                    Confirm
                                </label>
                            </div>
                        </div> 

                        <div class="classes">
                            <label class="radio-container">Economic
                                <input type="radio" name="travel-class" value="economic" checked>
                                <span class="checkmark"></span>
                            </label>
                            <label class="radio-container">Turist
                                <input type="radio" name="travel-class" value="turist">
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>
                    <div class="search">
                         <a href="vuelos.html" id="btn-search" class="btn-search">Search flights</a>
                    </div>
                </div> 
            </article>
        </section>
    </main>
    <script src="principal.js"></script>
</body>
</html>
