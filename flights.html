<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA - Available Flights</title>
    <!-- Vinculación de la hoja de estilos externa -->
    <link rel="stylesheet" type="text/css" href="flights.css">
</head>
<body>

    <!-- Contenedor principal para centrar y dar estilo a la tabla -->
    <div class="table-container">
        <h2 style="font-family: sans-serif; color: #0a1040; text-align: center; margin-bottom: 20px;">
            Available Flights
        </h2>
        
        <table class="flights-table">
            <thead>
                <tr>
                    <th>Flight</th>
                    <th>Origin</th>
                    <th>Destination</th>
                    <th>Departure Hour</th>
                    <th>Arrival Hour</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Vuelo 1 -->
                <tr>
                    <td><strong>AVA-101</strong></td>
                    <td>Madrid (MAD)</td>
                    <td>New York (JFK)</td>
                    <td>08:30 AM</td>
                    <td>11:45 AM</td>
                    <td><button class="btn-select">Select</button></td>
                </tr>
                <!-- Vuelo 2 -->
                <tr>
                    <td><strong>AVA-302</strong></td>
                    <td>London (LHR)</td>
                    <td>Tokyo (NRT)</td>
                    <td>10:15 AM</td>
                    <td>06:20 AM</td>
                    <td><button class="btn-select">Select</button></td>
                </tr>
                <!-- Vuelo 3 -->
                <tr>
                    <td><strong>AVA-550</strong></td>
                    <td>Paris (CDG)</td>
                    <td>Mexico City (MEX)</td>
                    <td>02:00 PM</td>
                    <td>07:10 PM</td>
                    <td><button class="btn-select">Select</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Scripts opcionales podrían ir aquí -->
    <script src="flights.js"></script>
</body>
</html>
