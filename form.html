<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details</title>
    <link rel="stylesheet" href="form.css">
</head>
<body> 
    <nav></nav>
    <header>
        <section id="passengers-container">
            </section>

        <template id="passenger-template">
            <div class="accordion-item">
                <div class="accordion-header">
                    <div class="accordion-info">
                        <span class="main-label passenger-type-label">Type</span>
                        <span class="sub-label"><h3>Add the passenger details</h3></span>
                    </div>
                    <div class="accordion-toggle">&#8250;</div>
                </div>
                <div class="accordion-panel">
                    <h2 class="passenger-title">Passenger</h2>
                    <br>
                    <form class="formulario" action="#" method="POST">
                        <div>
                            <label>First name <input type="text" name="name" required></label>
                            <label>Last name <input type="text" name="last" required></label>
                        </div>
                        <div>
                            <label>Email <input type="text" name="email" required></label>
                        </div>
                        <div>
                            <label>Passport <input type="text" name="passport" required></label>
                        </div>
                        <div>
                            <label>Date of Birth <input class="calendary" type="date" name="birth" required></label>
                        </div>

                        <select class="gender-select" name="gender"> 
                            <option value="opcion1" selected>Female</option>
                            <option value="opcion2">Male</option>
                            <option value="opcion3">None</option>
                        </select>

                        <div>
                            <div class="pregnancy-div" style="display: block;">
                                <p>Are you Pregnant?</p>
                                <input class="ask" type="radio" name="embarazo" value="No" checked /> no<br/>
                                <input class="ask" type="radio" name="embarazo" value="Yes"/> yes
                            </div>
                        </div>
                        <div>
                            <div class="disability-div">
                                <p>Do you have any disabilities?</p>
                                <input class="ask" type="radio" name="disability" value="No" checked /> no<br/>
                                <input class="ask" type="radio" name="disability" value="Yes"/> yes
                            </div>
                        </div>
                        <br>
                    </form>
                </div>
            </div>
        </template>

        <aside>
            <article>
                <button id="ticket">Select fare</button>
            </article>
        </aside>
    </header>
    <script src="form.js"></script>
</body>
</html>
