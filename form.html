<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details - AVA</title>
    <link rel="stylesheet" href="form.css">
</head>
<body> 
    <nav>
        </nav>
    <header>
        <section id="passengers-container">
        </section>

        <aside>
            <article>
                <button id="ticket">select fare</button>
            </article>
        </aside>
    </header>

    <template id="passenger-template">
        <div class="accordion-item">
            <div class="accordion-header">
                <div class="accordion-info">
                    <span class="main-label passenger-type-label">Adult</span>
                    <span class="sub-label"><h3 class="passenger-title-label">Add the passenger details</h3></span>
                </div>
                <div class="accordion-toggle">&#8250;</div>
            </div>
            <div class="accordion-panel">
                <h2 class="passenger-heading">Adult Passenger</h2>
                <br>
                <form class="formulario-pasajero" action="#" method="POST">
                    <div>
                        <label>First name <input type="text" name="name" required></label>
                        <label>Last name <input type="text" name="last" required></label>
                    </div>
                    <div>
                        <label>Email <input type="email" name="email" required></label>
                    </div>
                    <div>
                        <label>Passport <input type="text" name="passport" required></label>
                    </div>
                    <div>
                        <label>Date of Birth <input class="calendary" type="date" name="birth" required></label>
                    </div>

                    <select class="gender-select" name="gender"> 
                        <option value="opcion1" selected>Female</option>
                        <option value="opcion2">Male</option>
                        <option value="opcion3">None</option>
                    </select>

                    <div class="pregnancy-section">
                        <p>Are you Pregnant?</p>
                        <label><input type="radio" name="sexo" value="no" checked> no</label><br>
                        <label><input type="radio" name="sexo" value="yes"> yes</label>
                    </div>

                    <div class="disability-section">
                        <p>Do you have any disabilities?</p>
                        <label><input type="radio" name="disability" value="no" checked> no</label><br>
                        <label><input type="radio" name="disability" value="yes"> yes</label>
                    </div>
                    <br>
                    <button class="btn-submit" type="submit">save data</button>
                </form>
            </div>
        </div>
    </template>

    <script src="form.js"></script>
</body>
</html>
